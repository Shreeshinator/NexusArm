# Uno Q stack — bind Uno R3 serial into container, share host network for DroidCam/HF.
# Container does NOT auto-start ROS — you run commands yourself inside (see HARDWARE.md).
# Usage (fast — pull prebuilt, no build on 4GB Uno Q):
#   docker pull shreeshinator/nexusarm:unoq
#   docker compose up -d --no-build   # start container in background (no ROS yet) — uses image: below
#   docker compose exec arm bash       # open shell inside, then run ros2 launch ... yourself
# Legacy fallback only: docker tag shreeshinator/nexusarm:unoq nexusarm-arm:latest && docker compose up -d --no-build
# Usage (build locally — after Step 5 fix, needs 17G /home/arduino/docker):
#   docker compose up -d --build
# On Uno Q the device is almost always /dev/ttyACM0 (Uno R3). Override with env:
#   SERIAL_PORT=/dev/ttyUSB0 docker compose up -d

services:
  arm:
    image: shreeshinator/nexusarm:unoq
    build: .
    container_name: arm-stack
    network_mode: host          # DroidCam phone IP + HuggingFace reachable, DDS host-local
    privileged: false
    devices:
      - "${SERIAL_PORT:-/dev/ttyACM0}:${SERIAL_PORT:-/dev/ttyACM0}"
    volumes:
      # Mount src live for iteration (colcon --symlink-install) — comment out for frozen image
      - ./src:/workspace/src:ro
      # Persist datasets / HF cache / checkpoints across restarts
      - hf-cache:/root/.cache/huggingface
      - lerobot-cache:/root/.cache/huggingface/lerobot
    environment:
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyACM0}
      - BAUD_RATE=${BAUD_RATE:-115200}
      - FRONT_URL=${FRONT_URL:-}
      - GRIPPER_URL=${GRIPPER_URL:-}
      - FPS=${FPS:-15.0}
      - ENABLE_ROBOT=${ENABLE_ROBOT:-false}
    command: sleep infinity
    # Keeps container alive so you can exec and run ros2 commands manually
    restart: unless-stopped

volumes:
  hf-cache:
  lerobot-cache:
