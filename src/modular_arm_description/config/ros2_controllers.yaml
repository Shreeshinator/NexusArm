controller_manager: # for the controller manager node
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: # necessary for the joint state broadcaster to know which joints to monitor and report
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - finger_left_joint
      - finger_right_joint

arm_controller:
  ros__parameters: # necessary for the arm controller to know which joints to control
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - finger_left_joint
      - finger_right_joint
    command_interfaces: # which interfaces the controller will use to send commands to the joints
      - position
    state_interfaces: # which interfaces the controller will use to read the state of the joints
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.05 # the maximum allowed velocity when a joint is considered "stopped"
      goal_time: 0.5
